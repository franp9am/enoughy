[project]
name = "child-control-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "bcrypt",
    "fastapi",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "tzdata",  # Windows has no time zone database of its own
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "app.py", "views.py", "children.py", "auth.py", "db.py",
    "add_child.py", "add_parent.py", "set_password.py", "templates",
]
