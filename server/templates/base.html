<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enoughy</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1rem;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #fafafa; color: #1a1a1a;
  }
  .page { max-width: 26rem; margin: 0 auto; }
  h1 {
    display: flex; align-items: baseline;
    margin: 0 0 1.2rem; font-size: 1.4rem; font-weight: 600;
  }
  .card {
    background: #fff; border: 1px solid #ddd; border-top: none;
    border-radius: 0 0 10px 10px;
  }
  .card.plain { border-top: 1px solid #ddd; border-radius: 10px; }
  .section { padding: 1.25rem; border-top: 1px solid #eee; }
  .section:first-child { border-top: none; }
  .section h2 {
    margin: 0 0 .8rem; font-size: 1rem; font-weight: 600; color: #333;
  }
  .empty { color: #888; font-size: .9rem; }
  .whoami {
    display: inline-flex; align-items: center; gap: .45rem;
    margin-left: auto; align-self: center;
    padding: .3rem .7rem .3rem .5rem;
    border: 1px solid #ddd; border-radius: 999px; background: #fff;
    font-size: .9rem; font-weight: 400; color: #555;
    text-decoration: none;
  }
  .whoami:hover { border-color: #999; color: #1a1a1a; }
  .whoami:hover svg { stroke: #1a1a1a; }
  .whoami svg {
    width: 1.1rem; height: 1.1rem;
    fill: none; stroke: #999; stroke-width: 1.7; stroke-linecap: round;
  }
</style>
{% block style %}{% endblock %}
</head>
<body>
  <div class="page">
    <h1>{% block heading %}Enoughy{% endblock %}{% block whoami %}{% if parent %}<a class="whoami" href="{{ url_for('parent_page') }}" title="Your page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="3.6"></circle>
        <path d="M4.8 20c0-3.7 3.2-5.6 7.2-5.6s7.2 1.9 7.2 5.6"></path>
      </svg>{{ parent.login }}</a>{% endif %}{% endblock %}</h1>

    {% block content %}{% endblock %}
  </div>
  {% block script %}{% endblock %}
</body>
</html>
